<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://zeitra.web.app">
  <title>Zeitra — wird weitergeleitet…</title>
  <link rel="canonical" href="https://zeitra.web.app">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f0f1a;
      color: #c0c0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #4a9eff, #c84bff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 16px;
    }
    p { font-size: 15px; color: #8888aa; margin: 4px 0; }
    a {
      color: #4a9eff;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 24px;
      background: #1e1e35;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      margin-top: 20px;
      display: inline-block;
      transition: all 0.2s;
    }
    a:hover { background: #252545; border-color: #4a9eff; transform: translateY(-2px); }
    .pulse {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a9eff, #c84bff);
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
  </style>
  <script>
    // Sofortiger Redirect via JavaScript (zuverlässiger als Meta-Refresh)
    window.location.replace('https://zeitra.web.app');
  </script>
</head>
<body>
  <div class="pulse"></div>
  <h1>Zeitra</h1>
  <p>Wir sind umgezogen! Du wirst weitergeleitet zu:</p>
  <a href="https://zeitra.web.app">https://zeitra.web.app</a>
</body>
</html>
